    /* Custom Styles */
    
   html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* No scrolling needed */
            font-family: poppins;
        }

        .bigboul {
            height: 100vh;
            width: 100%;
            background-position: center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative; /* Ensure position relative for children positioning */
        }
	
  

        .mainboul {
            width: 100%;
            height: 100vh;
            background-image: url(https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEio3b5SZXyWpm814kK08SSenlR2fyHgahPIcWJrPfFIyt6_tysmPZwkUOaTz15niu_7lgoJu657wp2UuJmOj0SOqO81_d6K1caqo7bZft5-IrvY6Y5RI-23cjRcLDY5ix82p-TqElrftpOZkgVkhOXhqfCZQCCKGNcWWl6qLsSRpJxMF-MEHcHo2L001srR/s1600/ku-bg.jpeg);
            background-size: cover;
            background-position: center;
            background-attachment: fixed; /* Fixed background image */
            position: relative;
        }

        .mainboul::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%; /* Gradient covers full width */
            height: 100%;
            background: linear-gradient(to right, rgba(7, 6, 6, 0.705), #356a5400);
            z-index: 1; /* Lower z-index */
            pointer-events: none;
        }

        .textboul {
            position: absolute;
            z-index: 2; /* Higher z-index to appear above the gradient */
            top: 60%;
            left: 25%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            width: 80%; /* Make text container responsive */
        }

        .animated-name {
            font-size: 5vw; /* Responsive font size */
            font-weight: bold;
            width: 65%;
            text-align: left;
            margin-left: 35%;
            border-left: 7px solid rgb(255, 67, 67);
            line-height: 1;
            border-radius: 5px;
            padding-left: 5px;
            display: flex;
          
            justify-content: flex-start;
            color: white;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8);
            opacity: 0; /* Start with hidden */
            animation: moveIn 1s ease-out forwards, fadeIn 1s ease-out forwards;
        }

        @keyframes moveIn {
            0% {
                transform: translate(-150%, -50%); /* Start off-screen */
            }
            100% {
                transform: translate(0%, -50%); /* Move to the end position */
            }
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        .explore-button {
            padding: 10px 20px;
            font-size: 25px; /* Responsive font size */
            color: rgb(0, 0, 0);
            background-color: #ffea00;
            border: none;
            border-radius: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-left: 60px;
            opacity: 0; /* Start with hidden */
            animation: fadeIn 1s ease-out  1.5s forwards; /* Fade in after text */
            text-align: center;
            margin-top: 20px;
            
            transition: 0.3s all ease;
        }
        .explore-button:hover{
            background-color: rgb(255, 67, 67);
            border: 2px solid rgb(255, 255, 255);
            transform: scale(1.1);
        }

        .three-words {
             /* Responsive font size */
            color: white;
            margin-top: -60px;
            margin-left: 65px;
            text-align: center;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
            opacity: 0; /* Start with hidden */
            animation: fadeIn 1s ease-out 1s forwards; /* Fade in after button */
            white-space: nowrap; /* Prevent wrapping */
            /* margin-top: 20px; */
        }

        .three-words span {
            margin: 0 1rem; /* Adjust spacing between words */
        }
        .ug-sub{
    font-size: 20px;
   word-spacing: 10px;
}   

a{

}
