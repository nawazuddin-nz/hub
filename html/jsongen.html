<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project JSON Generator</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #f6f9fc;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .container {
      max-width: 800px;
      background: white;
      margin: 30px auto;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      font-weight: 600;
      display: block;
      margin-bottom: 5px;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 15px;
    }
    textarea {
      resize: vertical;
      min-height: 70px;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      margin-right: 10px;
    }
    button:hover {
      background: #0056b3;
    }
    .team-container {
      margin-top: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      background: #fafafa;
    }
    .team-member {
      border-bottom: 1px dashed #ccc;
      padding-bottom: 10px;
      margin-bottom: 10px;
    }
    pre {
      background: #272822;
      color: #f8f8f2;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
      white-space: pre-wrap;
    }
    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #28a745;
      color: white;
      padding: 10px 18px;
      border-radius: 6px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎯 Project JSON Generator</h1>

    <div class="form-group">
      <label>Project ID</label>
      <input type="text" id="id" placeholder="e.g. BCAS101" />
    </div>

    <div class="form-group">
      <label>Title</label>
      <input type="text" id="title" placeholder="e.g. NH Games 1.0" />
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea id="desc" placeholder="Describe your project..."></textarea>
    </div>

    <div class="form-group">
      <label>Date / Semester</label>
      <input type="text" id="date" placeholder="e.g. 1st Sem 23-24" />
    </div>

    <div class="form-group">
      <label>WhatsApp Link</label>
      <input type="url" id="whatsapp" placeholder="https://wa.link/..." />
    </div>

    <div class="form-group">
      <label>Project Link</label>
      <input type="url" id="projectLink" placeholder="https://yourproject.com/" />
    </div>

    <h3>👥 Team Members</h3>
    <div id="team" class="team-container"></div>
    <button onclick="addMember()">+ Add Team Member</button>

    <br><br>
    <button onclick="generateJSON()">Generate JSON</button>
    <button onclick="copyJSON()">📋 Copy JSON</button>
    <button onclick="resetForm()">🔄 Reset</button>

    <h3>📦 Output JSON:</h3>
    <pre id="output">{ }</pre>
  </div>

  <div id="toast" class="toast">Copied to clipboard!</div>

  <script>
    const teamContainer = document.getElementById("team");
    const output = document.getElementById("output");
    const toast = document.getElementById("toast");

    function addMember() {
      const memberDiv = document.createElement("div");
      memberDiv.classList.add("team-member");
      memberDiv.innerHTML = `
        <label>Name</label>
        <input type="text" class="member-name" placeholder="Name" />
        <label>Image URL</label>
        <input type="url" class="member-img" placeholder="Image URL" />
        <label>LinkedIn URL</label>
        <input type="url" class="member-linkedin" placeholder="LinkedIn URL (optional)" />
      `;
      teamContainer.appendChild(memberDiv);
    }

    function generateJSON() {
      const id = document.getElementById("id").value.trim();
      const title = document.getElementById("title").value.trim();
      const desc = document.getElementById("desc").value.trim();
      const date = document.getElementById("date").value.trim();
      const whatsapp = document.getElementById("whatsapp").value.trim();
      const projectLink = document.getElementById("projectLink").value.trim();

      const teamMembers = [...document.querySelectorAll(".team-member")].map(m => ({
        name: m.querySelector(".member-name").value.trim(),
        img: m.querySelector(".member-img").value.trim(),
        linkedin: m.querySelector(".member-linkedin").value.trim()
      }));

      const result = {
        id,
        title,
        desc,
        date,
        whatsapp,
        projectLink,
        team: teamMembers
      };

      output.textContent = JSON.stringify(result, null, 2);
    }

    async function copyJSON() {
      const text = output.textContent;
      if (text.trim() === "{}") return showToast("⚠️ No JSON to copy!");
      await navigator.clipboard.writeText(text);
      showToast("✅ JSON copied!");
    }

    function resetForm() {
      document.querySelectorAll("input, textarea").forEach(el => el.value = "");
      teamContainer.innerHTML = "";
      output.textContent = "{ }";
      addMember();
      showToast("🔄 Form reset!");
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2000);
    }

    // Add one member by default
    addMember();
  </script>
</body>
</html>
